<svg width="640" height="200" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0f1a"/>
      <stop offset="100%" stop-color="#05060c"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cdeb5c"/>
      <stop offset="100%" stop-color="#9ec23a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="200" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="638" height="198" rx="15" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- LCD screen icon -->
  <g transform="translate(36,46)">
    <rect x="0" y="0" width="108" height="108" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
    <rect x="10" y="10" width="88" height="88" rx="3" fill="url(#lcd)" filter="url(#glow)"/>
    <!-- pixel grid overlay -->
    <g stroke="#05060c" stroke-width="1" opacity="0.18">
      <line x1="10" y1="32" x2="98" y2="32"/>
      <line x1="10" y1="54" x2="98" y2="54"/>
      <line x1="10" y1="76" x2="98" y2="76"/>
      <line x1="32" y1="10" x2="32" y2="98"/>
      <line x1="54" y1="10" x2="54" y2="98"/>
      <line x1="76" y1="10" x2="76" y2="98"/>
    </g>
    <!-- play / run glyph -->
    <path d="M44 36 L72 54 L44 72 Z" fill="#1a1d12" opacity="0.55"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-weight="700">
    <text x="166" y="100" font-size="46" fill="#ff8c00" letter-spacing="2">FAP</text>
    <text x="252" y="100" font-size="46" fill="#f5f5f0" letter-spacing="2">EMU</text>
  </g>
  <text x="168" y="128" font-family="'JetBrains Mono','Courier New',monospace" font-size="14"
        fill="rgba(255,140,0,0.45)" letter-spacing="3">
    FLIPPER-COMPATIBLE APP EMULATOR
  </text>

  <!-- status pill -->
  <g transform="translate(168,144)">
    <circle cx="6" cy="6" r="5" fill="#7ed957"/>
    <text x="18" y="11" font-family="'JetBrains Mono','Courier New',monospace" font-size="13"
          fill="rgba(255,255,255,0.4)" letter-spacing="2">RUNS IN BROWSER · NO HARDWARE REQUIRED</text>
  </g>
</svg>
