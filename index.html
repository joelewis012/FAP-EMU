/* ── ELF Parser ────────────────────────────────────────────────────────── */
function parseELF(buffer){
  const view=new DataView(buffer),u8=new Uint8Array(buffer);
  if(view.getUint32(0,false)!==0x7f454c46)throw new Error("Not a valid ELF file");
  if(u8[4]!==1)throw new Error("Only 32-bit ELF supported");
  const le=u8[5]===1;
  const eMachine=view.getUint16(18,le),eEntry=view.getUint32(24,le);
  const eShoff=view.getUint32(32,le),eSz=view.getUint16(46,le);
  const eShnum=view.getUint16(48,le),eShstrndx=view.getUint16(50,le);
  if(eMachine!==EM_ARM)throw new Error("Not an ARM binary — is this a .fap?");
  const rs=(o,max=256)=>{let s='';for(let i=0;i<max;i++){const c=u8[o+i];if(!c)break;s+=String.fromCharCode(c);}return s;};
  const shdrs=[];
  for(let i=0;i<eShnum;i++){const o=eShoff+i*eSz;shdrs.push({nameIdx:view.getUint32(o,le),type:view.getUint32(o+4,le),flags:view.getUint32(o+8,le),addr:view.getUint32(o+12,le),offset:view.getUint32(o+16,le),size:view.getUint32(o+20,le),link:view.getUint32(o+24,le),info:view.getUint32(o+28,le),entsize:view.getUint32(o+36,le)});}
  const ss=shdrs[eShstrndx];shdrs.forEach(s=>{s.name=rs(ss.offset+s.nameIdx);});
  const dynsym=shdrs.find(s=>s.name==='.dynsym'),dynstr=shdrs.find(s=>s.name==='.dynstr');
  const symtab=shdrs.find(s=>s.name==='.symtab'),strtab=shdrs.find(s=>s.name==='.strtab');
  const imports=[];
  const parseSym=(symSec,strSec)=>{const ent=symSec.entsize||16,cnt=Math.floor(symSec.size/ent);for(let i=1;i<cnt;i++){const o=symSec.offset+i*ent,ni=view.getUint32(o,le),val=view.getUint32(o+4,le),info=u8[o+12],shndx=view.getUint16(o+14,le),name=rs(strSec.offset+ni);if(shndx===SHN_UNDEF&&name.length>0&&!imports.find(x=>x.name===name))imports.push({name,value:val,binding:info>>4,type:info&0xf});}};
  if(dynsym&&dynstr)parseSym(dynsym,dynstr);
  if(symtab&&strtab)parseSym(symtab,strtab);
  /* Also extract DEFINED SDK function addresses for static binary interception */
  const SDK_FNS=new Set(['canvas_commit','canvas_clear','canvas_set_font','canvas_set_color','canvas_draw_str','canvas_draw_str_aligned','canvas_draw_dot','canvas_draw_line','canvas_draw_frame','canvas_draw_box','canvas_draw_circle','canvas_draw_disc','canvas_draw_icon','canvas_draw_xbm','canvas_width','canvas_height','view_port_alloc','view_port_free','view_port_enabled_set','view_port_draw_callback_set','view_port_input_callback_set','view_port_update','gui_add_view_port','gui_remove_view_port','furi_delay_ms','furi_delay_tick','furi_thread_yield','furi_record_open','furi_record_close','malloc','free','calloc','realloc','furi_message_queue_alloc','furi_message_queue_put','furi_message_queue_get','furi_message_queue_free','furi_semaphore_alloc','furi_semaphore_acquire','furi_semaphore_release','furi_semaphore_free','furi_mutex_alloc','furi_mutex_acquire','furi_mutex_release','furi_mutex_free']);
  const definedFns={};
  if(symtab&&strtab){const ent=symtab.entsize||16,cnt=Math.floor(symtab.size/ent);for(let i=1;i<cnt;i++){const o=symtab.offset+i*ent,ni=view.getUint32(o,le),val=view.getUint32(o+4,le),info=u8[o+12],shndx=view.getUint16(o+14,le),name=rs(strtab.offset+ni);if(shndx!==SHN_UNDEF&&shndx!==0xFFFF&&val>0&&(info&0xf)<=2&&SDK_FNS.has(name))definedFns[name]=val;}}
  const rodata=shdrs.find(s=>s.name==='.rodata');
  const strings=[];if(rodata){let cur='';for(let i=0;i<rodata.size;i++){const c=u8[rodata.offset+i];if(c===0&&cur.length>=3){strings.push(cur);cur='';}else if(c>=32&&c<127)cur+=String.fromCharCode(c);else cur='';}}
  const appId=strings.find(s=>/^[a-z][a-z0-9_]{2,24}$/.test(s)&&!['text','data','bss','got','plt'].includes(s));
  const appName=strings.find(s=>/^[A-Z][A-Za-z0-9 \-_]{2,30}$/.test(s)&&s!==appId);
  const relSections=shdrs.filter(s=>s.name.startsWith('.rel')&&(s.type===9||s.type===4));
  const sections=shdrs.filter(s=>s.name&&s.name.length>0&&s.size>0);
  /* Parse program headers for correct VMA-based loading */
  const ePhoff=view.getUint32(28,le),ePhentsize=view.getUint16(42,le)||32,ePhnum=view.getUint16(44,le);
  const phdrs=[];
  for(let i=0;i<ePhnum;i++){const o=ePhoff+i*ePhentsize;phdrs.push({type:view.getUint32(o,le),offset:view.getUint32(o+4,le),vaddr:view.getUint32(o+8,le),paddr:view.getUint32(o+12,le),filesz:view.getUint32(o+16,le),memsz:view.getUint32(o+20,le),flags:view.getUint32(o+24,le)});}
  const fastRelSec=shdrs.find(s=>s.name==='.fast.rel.text');
  const fastRelBytes=fastRelSec?Array.from(u8.slice(fastRelSec.offset,fastRelSec.offset+fastRelSec.size)):null;
  return{fileName:'',fileSize:buffer.byteLength,buffer,eEntry,isDyn:view.getUint16(16,le)===3,sections,rawSections:shdrs,phdrs,imports,definedFns,relSections,fastRelBytes,appId,appName,textSize:sections.find(s=>s.name==='.text')?.size??0,rodataSize:rodata?.size??0,bssSize:sections.find(s=>s.name==='.bss')?.size??0,dataSize:sections.find(s=>s.name==='.data')?.size??0};
}

/* ── Display (Phase 3: icon rendering from XBM bitmap in memory) ──────── */
class FlipperDisplay{
  constructor(){this.px=new Uint8Array(LCD_W*LCD_H);this.color=1;this.font='primary';}
  clear(){this.px.fill(0);}
  setColor(c){this.color=c?1:0;}
  invertColor(){this.color^=1;}
  dot(x,y){x=x|0;y=y|0;if(x>=0&&x<LCD_W&&y>=0&&y<LCD_H)this.px[y*LCD_W+x]=this.color;}
  line(x0,y0,x1,y1){x0=x0|0;y0=y0|0;x1=x1|0;y1=y1|0;const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let err=dx-dy;for(;;){this.dot(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>-dy){err-=dy;x0+=sx;}if(e2<dx){err+=dx;y0+=sy;}}}
  box(x,y,w,h){for(let py=y|0;py<(y+h)|0;py++)for(let px=x|0;px<(x+w)|0;px++)this.dot(px,py);}
  frame(x,y,w,h){this.line(x,y,x+w-1,y);this.line(x,y+h-1,x+w-1,y+h-1);this.line(x,y,x,y+h-1);this.line(x+w-1,y,x+w-1,y+h-1);}
  rbox(x,y,w,h,r){this._r(x,y,w,h,r,true);}
  rframe(x,y,w,h,r){this._r(x,y,w,h,r,false);}
  _r(x,y,w,h,r,fill){r=Math.min(r,Math.floor(w/2),Math.floor(h/2));if(fill){this.box(x+r,y,w-2*r,h);this.box(x,y+r,r,h-2*r);this.box(x+w-r,y+r,r,h-2*r);}else{this.line(x+r,y,x+w-r-1,y);this.line(x+r,y+h-1,x+w-r-1,y+h-1);this.line(x,y+r,x,y+h-r-1);this.line(x+w-1,y+r,x+w-1,y+h-r-1);}for(let cy=0;cy<r;cy++)for(let cx=0;cx<r;cx++){if((cx+.5)*(cx+.5)+(cy+.5)*(cy+.5)<=r*r){if(fill||cx===0||cy===0){this.dot(x+r-1-cx,y+r-1-cy);this.dot(x+w-r+cx,y+r-1-cy);this.dot(x+r-1-cx,y+h-r+cy);this.dot(x+w-r+cx,y+h-r+cy);}}}}
  circle(cx,cy,r){let x=r,y=0,err=0;while(x>=y){[[cx+x,cy+y],[cx+y,cy+x],[cx-y,cy+x],[cx-x,cy+y],[cx-x,cy-y],[cx-y,cy-x],[cx+y,cy-x],[cx+x,cy-y]].forEach(([a,b])=>this.dot(a,b));if(err<=0){y++;err+=2*y+1;}if(err>0){x--;err-=2*x+1;}}}
  disc(cx,cy,r){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r)this.dot(cx+x,cy+y);}
  /* Phase 3: improved font using tuned canvas sizes */
  str(x,y,text,font){
    if(!text)return;
    const sz=font==='secondary'?6:font==='keyboard'?11:font==='bignumbers'?20:8;
    try{const tmp=document.createElement('canvas');tmp.width=Math.max(4,text.length*(sz+2));tmp.height=sz+4;const ctx=tmp.getContext('2d');ctx.font=`${sz}px monospace`;ctx.fillStyle='white';ctx.fillText(text,0,sz);const d=ctx.getImageData(0,0,tmp.width,tmp.height).data;for(let py=0;py<tmp.height;py++)for(let px=0;px<tmp.width;px++)if(d[(py*tmp.width+px)*4+3]>64)this.dot(x+px,y+py);}catch(e){}
  }
  /* Phase 3: XBM icon rendering — parse Icon struct from emulator memory */
  drawIcon(uc,x,y,iconPtr){
    if(!uc||!iconPtr)return;
    try{
      const hdr=uc.mem_read(iconPtr,8);
      const w=hdr[0],h=hdr[1];
      if(w===0||h===0||w>128||h>64)return;
      /* frames** pointer at offset 4 */
      const fArrPtr=(hdr[4])|(hdr[5]<<8)|(hdr[6]<<16)|(hdr[7]<<24);
      if(!fArrPtr)return;
      const fpb=uc.mem_read(fArrPtr,4);
      const framePtr=(fpb[0])|(fpb[1]<<8)|(fpb[2]<<16)|(fpb[3]<<24);
      if(!framePtr)return;
      const bpr=Math.ceil(w/8);
      const data=uc.mem_read(framePtr,bpr*h);
      for(let row=0;row<h;row++)
        for(let col=0;col<w;col++)
          if(data[row*bpr+Math.floor(col/8)]&(1<<(col%8)))this.dot(x+col,y+row);
    }catch(e){}
  }
  render(canvas,scale){
    canvas.width=LCD_W*scale;canvas.height=LCD_H*scale;
    const ctx=canvas.getContext('2d'),img=ctx.createImageData(LCD_W*scale,LCD_H*scale);
    for(let y=0;y<LCD_H;y++)for(let x=0;x<LCD_W;x++){const on=this.px[y*LCD_W+x];const[r,g,b]=on?GB_ON:GB_OFF;for(let sy=0;sy<scale;sy++)for(let sx=0;sx<scale;sx++){const i=((y*scale+sy)*(LCD_W*scale)+(x*scale+sx))*4;img.data[i]=r;img.data[i+1]=g;img.data[i+2]=b;img.data[i+3]=255;}}
    ctx.putImageData(img,0,0);
  }
}

/* ── Stubs (Phase 3: ViewDispatcher, View, SceneManager, Widgets) ──────── */
function buildStubs(display,inputQueueRef,logFn,cb={}){const{onDraw,onWaitInput}=cb;
  const stubs={},handlers={};let nextAddr=STUB_BASE;
  const log=logFn||(()=>{});
  function reg(name,fn){stubs[name]=nextAddr;handlers[nextAddr]=fn;nextAddr+=4;}
  const d=display;let heap=HEAP_BASE;
  const rr=(uc,n)=>(uc.reg_read(RP.R0+n))>>>0;
  const spa=(uc,n)=>{const s=(uc.reg_read(RP.SP))>>>0;const b=uc.mem_read(s+n*4,4);return(b[0]|(b[1]<<8)|(b[2]<<16)|(b[3]<<24))>>>0;};
  const rs=(uc,addr)=>{if(!addr)return'';let s='';try{for(let i=0;i<256;i++){const b=uc.mem_read(addr+i,1)[0];if(!b)break;s+=String.fromCharCode(b);}}catch(e){}return s;};
  const mm=(uc,sz)=>{if(!sz)return 0;const a=heap;heap+=(sz+7)&~7;try{if(uc)uc.mem_write(a,new Uint8Array(sz));}catch(e){}return a;};
  const w32=(uc,addr,val)=>{const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,val,true);try{uc.mem_write(addr,b);}catch(e){}};

  /* Canvas */
  reg('canvas_clear',            ()=>d.clear());
  reg('canvas_commit',           ()=>{});
  reg('canvas_set_color',        (uc)=>d.setColor(rr(uc,1)));
  reg('canvas_invert_color',     ()=>d.invertColor());
  reg('canvas_set_font',         (uc)=>{const f=['primary','secondary','keyboard','bignumbers'];d.font=f[rr(uc,1)]||'primary';});
  reg('canvas_width',            ()=>128);
  reg('canvas_height',           ()=>64);
  reg('canvas_draw_dot',         (uc)=>d.dot(rr(uc,1),rr(uc,2)));
  reg('canvas_draw_line',        (uc)=>d.line(rr(uc,1),rr(uc,2),rr(uc,3),spa(uc,0)));
  reg('canvas_draw_box',         (uc)=>d.box(rr(uc,1),rr(uc,2),rr(uc,3),spa(uc,0)));
  reg('canvas_draw_frame',       (uc)=>d.frame(rr(uc,1),rr(uc,2),rr(uc,3),spa(uc,0)));
  reg('canvas_draw_rbox',        (uc)=>d.rbox(rr(uc,1),rr(uc,2),rr(uc,3),spa(uc,0),spa(uc,1)));
  reg('canvas_draw_rframe',      (uc)=>d.rframe(rr(uc,1),rr(uc,2),rr(uc,3),spa(uc,0),spa(uc,1)));
  reg('canvas_draw_circle',      (uc)=>d.circle(rr(uc,1),rr(uc,2),rr(uc,3)));
  reg('canvas_draw_disc',        (uc)=>d.disc(rr(uc,1),rr(uc,2),rr(uc,3)));
  reg('canvas_draw_str',         (uc)=>d.str(rr(uc,1),rr(uc,2),rs(uc,rr(uc,3)),d.font));
  reg('canvas_draw_str_aligned', (uc)=>d.str(rr(uc,1),rr(uc,2),rs(uc,spa(uc,1)),d.font));
  /* Phase 3: icon rendering */
  reg('canvas_draw_icon',        (uc)=>d.drawIcon(uc,rr(uc,1),rr(uc,2),rr(uc,3)));
  reg('canvas_draw_bitmap',      ()=>{});
  reg('canvas_get_font_params',  ()=>{});

  /* ViewPort */
  let vpDraw=0,vpInput=0,vpCtx=0;
  reg('view_port_alloc',              (uc)=>mm(uc,64));
  reg('view_port_free',               ()=>{});
  reg('view_port_enabled_set',        ()=>{});
  reg('view_port_draw_callback_set',  (uc)=>{vpDraw=rr(uc,1);vpCtx=rr(uc,2);log(`[VP] draw_cb=0x${rr(uc,1).toString(16)}`);});
  reg('view_port_input_callback_set', (uc)=>{vpInput=rr(uc,1);log(`[VP] input_cb=0x${rr(uc,1).toString(16)}`);});
  reg('view_port_update',             ()=>{onDraw?.();});
  stubs._getVPDraw=()=>vpDraw;stubs._getVPInput=()=>vpInput;stubs._getVPCtx=()=>vpCtx;

  /* GUI */
  reg('gui_add_view_port',         ()=>{log('[GUI] viewport added');onDraw?.();});
  reg('gui_remove_view_port',      ()=>{});
  reg('gui_get_framebuffer_size',  ()=>1024);

  /* Phase 3: ViewDispatcher */
  let vdCtx=0,vdCustomCb=0,vdNavCb=0;
  reg('view_dispatcher_alloc',                        (uc)=>mm(uc,128));
  reg('view_dispatcher_free',                         ()=>{});
  reg('view_dispatcher_enable_queue',                 ()=>{});
  reg('view_dispatcher_attach_to_gui',                ()=>log('[VD] attached to GUI'));
  reg('view_dispatcher_run',                          ()=>{log('[VD] run() — event loop, triggering draw');onDraw?.();});
  reg('view_dispatcher_stop',                         ()=>{});
  reg('view_dispatcher_add_view',                     ()=>{});
  reg('view_dispatcher_remove_view',                  ()=>{});
  reg('view_dispatcher_switch_to_view',               (uc)=>log(`[VD] switch_to_view(${rr(uc,1)})`));
  reg('view_dispatcher_send_custom_event',            ()=>{});
  reg('view_dispatcher_set_event_callback_context',   (uc)=>{vdCtx=rr(uc,1);});
  reg('view_dispatcher_set_custom_event_callback',    (uc)=>{vdCustomCb=rr(uc,1);});
  reg('view_dispatcher_set_navigation_event_callback',(uc)=>{vdNavCb=rr(uc,1);});
  reg('view_dispatcher_set_tick_event_callback',      ()=>{});

  /* Phase 3: View */
  reg('view_alloc',             (uc)=>mm(uc,128));
  reg('view_free',              ()=>{});
  reg('view_set_draw_callback', (uc)=>{vpDraw=rr(uc,1);vpCtx=rr(uc,2);log(`[VIEW] draw_cb=0x${rr(uc,1).toString(16)}`);});
  reg('view_set_input_callback',(uc)=>{vpInput=rr(uc,1);});

/* ── ELF Loader ────────────────────────────────────────────────────────── */
function loadFAP(uc,fap,stubs,log){
  const u8=new Uint8Array(fap.buffer),view=new DataView(fap.buffer),le=true;
  const rs=(o,max=64)=>{let s='';for(let i=0;i<max;i++){const c=u8[o+i];if(!c)break;s+=String.fromCharCode(c);}return s;};
  const w32=(addr,val)=>{const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,val,le);uc.mem_write(addr,b);};
  uc.mem_map(LOAD_BASE,4*1024*1024,7);uc.mem_map(RAM_BASE,1*1024*1024,6);uc.mem_map(STUB_BASE,1*1024*1024,7);
  /* Peripheral space for hardware register writes (no exec) */
  try{uc.mem_map(STUB_BASE+0x100000,7*1024*1024,6);}catch(e){}  // 0x40100000-0x40800000
  try{uc.mem_map(0xE0000000,0x10000,6);}catch(e){}              // ARM system control
  /* Null page — unresolved calls land here and return */
  try{uc.mem_map(0,0x10000,5);const np=new Uint8Array(0x10000);for(let i=0;i<0x8000;i++){np[i*2]=0x70;np[i*2+1]=0x47;}uc.mem_write(0,np);}catch(e){}
  /* EXC_RETURN zone (0xFFFF0000) — Cortex-M exception returns land here */
  try{uc.mem_map(0xFFFF0000,0x10000,5);const er=new Uint8Array(0x10000);for(let i=0;i<0x8000;i++){er[i*2]=0x70;er[i*2+1]=0x47;}uc.mem_write(0xFFFF0000,er);}catch(e){}
  const sc=new Uint8Array(1024*4);for(let i=0;i<1024;i++){sc[i*4]=0x70;sc[i*4+1]=0x47;}uc.mem_write(STUB_BASE,sc);
  const sec=n=>fap.rawSections.find(s=>s.name===n);
  const hasPhdrs=fap.phdrs&&fap.phdrs.some(p=>p.type===1);
  let delta=0;
  if(hasPhdrs){
    /* PHDR-based loading — sections land at correct VMAs */
    log('[LOAD] Using program headers');
    for(const ph of fap.phdrs){
      if(ph.type!==1)continue;
      if(ph.filesz>0){try{uc.mem_write(ph.vaddr,u8.slice(ph.offset,ph.offset+ph.filesz));log(`[LOAD] PHDR @ 0x${ph.vaddr.toString(16)} (${ph.filesz}B)`);}catch(e){log(`[LOAD] PHDR err: ${e?.message??String(e)}`);}}
      if(ph.memsz>ph.filesz){try{uc.mem_write(ph.vaddr+ph.filesz,new Uint8Array(ph.memsz-ph.filesz));}catch(e){}}
    }
  } else {
    /* Section-based fallback — guard against .data overwriting .text */
    const textSec=sec('.text');const baseVA=textSec?.addr??0;delta=LOAD_BASE-baseVA;
    const textEnd=LOAD_BASE+(textSec?.size??0);
    const ls=s=>{
      if(!s||!s.size)return;
      const dst=s.addr+delta;
      /* If a writable section would land inside the code area, redirect it to RAM */
      const isWritable=(s.flags&1)!==0;
      const overlapsText=dst>=LOAD_BASE&&dst<textEnd;
      const target=(isWritable&&overlapsText)?RAM_BASE+(dst-LOAD_BASE):dst;
      if(isWritable&&overlapsText)log(`[LOAD] ${s.name} redirected from 0x${dst.toString(16)} to RAM 0x${target.toString(16)} (${s.size}B)`);
      else log(`[LOAD] ${s.name} @ 0x${dst.toString(16)} (${s.size}B)`);
      try{uc.mem_write(target,u8.slice(s.offset,s.offset+s.size));}catch(e){log(`[LOAD] err: ${e?.message??String(e)}`);}
    };
    ls(textSec);ls(sec('.rodata'));ls(sec('.data'));ls(sec('.got'));ls(sec('.got.plt'));
    const bss=sec('.bss');if(bss){const dst=bss.addr+delta;const isW=(bss.flags&1)!==0;const t=(isW&&dst>=LOAD_BASE&&dst<textEnd)?RAM_BASE+(dst-LOAD_BASE):dst;try{uc.mem_write(t,new Uint8Array(bss.size));}catch(e){}}
  }
  const callSites=[];
  for(const rel of fap.relSections){
    const hasA=rel.name.startsWith('.rela'),ent=hasA?12:8,cnt=Math.floor(rel.size/ent);
    /* Use the rel section's link field to find its symbol table, then that symtab's link for the string table */
    const relSymSec=fap.rawSections[rel.link]||sec('.dynsym')||sec('.symtab');
    const relStrSec=relSymSec?fap.rawSections[relSymSec.link]||sec('.dynstr')||sec('.strtab'):null;
    for(let i=0;i<cnt;i++){
      const o=rel.offset+i*ent,offset=view.getUint32(o,le)+delta,info=view.getUint32(o+4,le);
      const symIdx=info>>8,relType=info&0xFF,addend=hasA?view.getInt32(o+8,le):0;
      let symName='';if(relSymSec&&relStrSec&&symIdx>0){const so=relSymSec.offset+symIdx*(relSymSec.entsize||16);symName=rs(relStrSec.offset+view.getUint32(so,le));}
      if(relType===21||relType===22){stubs._regUnknown(symName);const sa=stubs[symName];if(sa!==undefined){w32(offset,sa);log(`[REL] SLOT ${symName}`);}}
      else if(relType===23){w32(offset,LOAD_BASE+addend);}
      else if(relType===2){try{const cur=view.getUint32(offset,le);w32(offset,cur+(LOAD_BASE-baseVA));}catch(e){}}
      else if(relType===10||relType===28){/* R_ARM_THM_CALL/CALL — hook call site */
        if(symName){stubs._regUnknown(symName);callSites.push({addr:offset,symName});log(`[REL] CALL ${symName} @ 0x${offset.toString(16)}`);}
      }
    }
  }
  uc.reg_write(RP.SP,STACK_TOP);uc.reg_write(RP.LR,0xFEFEFEFE);
  /* ── Parse .fast.rel.text to fill Flipper SDK PLT slots ─────────────────── */
  if(fap.fastRelBytes&&fap.fastRelBytes.length>5){
    const fr=new Uint8Array(fap.fastRelBytes);
    const frdv=new DataView(fr.buffer);
    /* DJB2 hash function matching Flipper firmware */
    const djb2=(s)=>{let h=5381;for(const c of s)h=(((h<<5)+h)+c.charCodeAt(0))>>>0;return h;};
    /* Build hash→name map for all known stubs */
    const h2n={};
    for(const name of Object.keys(stubs)){if(typeof stubs[name]==='number'&&name!=='_regUnknown'&&name!=='_getVPDraw'&&name!=='_getVPCtx')h2n[djb2(name)]=name;}
    let pos=5,resolved=0;
    while(pos<fr.length-8){
      const type=fr[pos];
      if(type===0x8A){
        /* EABI math: skip header+sites */
        if(pos+13>fr.length)break;
        const count=frdv.getUint32(pos+9,true);
        pos+=13+count*3;
      }else if(type===0x02||type===0x82){
        /* Flipper SDK entry: 0x02 = standard, 0x82 = flagged variant (same structure) */
        if(pos+9>fr.length)break;
        const hash=frdv.getUint32(pos+1,true);
        const count=frdv.getUint32(pos+5,true);
        if(count>500){log(`[FAST] bad count ${count} at pos ${pos}, skipping`);pos++;continue;}
        const fnName=h2n[hash];
        for(let i=0;i<count;i++){
          if(pos+9+i*3+2>=fr.length)break;
          const stubOff=fr[pos+9+i*3]|(fr[pos+9+i*3+1]<<8)|(fr[pos+9+i*3+2]<<16);
          const stubAddr=LOAD_BASE+stubOff;
          if(fnName&&stubs[fnName]!==undefined){
            /* Scan stub for first 4-aligned zero word (the PLT slot) — up to 32 bytes */
            let slotAddr=null;
            for(let o=0;o<=32;o+=2){
              const a=(stubAddr+o+3)&~3;
              if(a-stubAddr>32)break;
              try{const b=new Uint8Array(4);uc.mem_read(a,b);if(new DataView(b.buffer).getUint32(0,true)===0){slotAddr=a;break;}}catch(e){}
            }
            if(slotAddr){w32(slotAddr,stubs[fnName]);log(`[FAST] ${fnName} → 0x${slotAddr.toString(16)}`);resolved++;}
            else{log(`[FAST] ${fnName} — no slot near 0x${stubAddr.toString(16)}`);}
          }else if(fnName===undefined){
            log(`[FAST] hash 0x${hash.toString(16)} unknown`);
          }
        }
        pos+=9+count*3;
      }else if(type===0x01||type===0x00){
        /* Skip padding/alignment bytes */
        pos++;
      }else{log(`[FAST] unknown type 0x${type.toString(16)} at pos ${pos} — skipping`);pos++;continue;}
    }
    log(`[FAST] resolved ${resolved} SDK slots`);
  }
  const entry=hasPhdrs?(fap.eEntry|1):((fap.eEntry+delta)|1);log(`[EMU] Entry: 0x${entry.toString(16)}`);return{entry,callSites};
}

function useWindowWidth(){const[w,setW]=useState(window.innerWidth);useEffect(()=>{const h=()=>setW(window.innerWidth);window.addEventListener('resize',h);return()=>window.removeEventListener('resize',h);},[]);return w;}

/* ── Components ────────────────────────────────────────────────────────── */
function ZoomModal({canvasRef,onClose}){
  const bigRef=useRef();
  useEffect(()=>{if(!bigRef.current||!canvasRef.current)return;const ctx=bigRef.current.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(canvasRef.current,0,0,LCD_W*6,LCD_H*6);});
  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.93)',zIndex:999,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:12,padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:'#111',border:'4px solid #1a1a2e',borderRadius:4,padding:6,boxShadow:'0 0 60px rgba(155,188,15,0.4)',maxWidth:'100%'}}>
        <canvas ref={bigRef} width={LCD_W*6} height={LCD_H*6} style={{display:'block',imageRendering:'pixelated',maxWidth:'100%',height:'auto'}}/>
      </div>
      <div style={{fontSize:10,color:'rgba(155,188,15,0.4)',letterSpacing:'0.12em'}}>768×384 · 6× ZOOM</div>
      <button onClick={onClose} style={{background:'transparent',border:'1px solid rgba(255,255,255,0.2)',color:'rgba(255,255,255,0.5)',padding:'8px 24px',fontFamily:'monospace',fontSize:11,cursor:'pointer',borderRadius:3}}>[ CLOSE ]</button>
    </div>
  );
}

function FlipperScreen({canvasRef,scale,onZoom}){
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
      <div style={{position:'relative',display:'inline-block'}}>
        <div style={{background:'#1a1a2e',padding:'6px 6px 4px',borderRadius:4,boxShadow:'0 0 24px rgba(155,188,15,0.2)',border:'2px solid #252545'}}>
          <canvas ref={canvasRef} width={LCD_W*scale} height={LCD_H*scale} style={{display:'block',imageRendering:'pixelated'}}/>
        </div>
        <button onClick={onZoom} style={{position:'absolute',top:3,right:3,background:'rgba(0,0,0,0.85)',border:'1px solid rgba(255,255,255,0.12)',color:'rgba(255,255,255,0.45)',width:22,height:22,fontSize:12,cursor:'pointer',borderRadius:2,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'monospace',padding:0}}>⛶</button>
      </div>
      <div style={{fontSize:9,color:'rgba(255,255,255,0.12)',letterSpacing:'0.14em'}}>128×64 · MONOCHROME LCD</div>
    </div>
  );
}

function DPad({onInput}){
  const D=44;
  const b=(label,key,accent)=>(
    <button onPointerDown={e=>{e.preventDefault();onInput(key,InputType.Press);}} onPointerUp={e=>{e.preventDefault();onInput(key,InputType.Release);}}
      style={{width:D,height:D,background:accent?'rgba(255,140,0,0.15)':'rgba(255,255,255,0.06)',border:`1px solid ${accent?'rgba(255,140,0,0.35)':'rgba(255,255,255,0.1)'}`,color:accent?'#ff9900':'rgba(255,255,255,0.65)',borderRadius:4,cursor:'pointer',fontFamily:'monospace',fontSize:12,display:'flex',alignItems:'center',justifyContent:'center',userSelect:'none',WebkitUserSelect:'none',touchAction:'none'}}>
      {label}
    </button>
  );
  return(
    <div style={{display:'flex',gap:14,alignItems:'center',justifyContent:'center',flexWrap:'wrap'}}>
      <div style={{display:'grid',gridTemplateColumns:`${D}px ${D}px ${D}px`,gridTemplateRows:`${D}px ${D}px ${D}px`,gap:3}}>
        <span/>{b('▲',InputKey.Up)}<span/>
        {b('◀',InputKey.Left)}{b('OK',InputKey.Ok,true)}{b('▶',InputKey.Right)}
        <span/>{b('▼',InputKey.Down)}<span/>
      </div>
      {b('BACK',InputKey.Back)}
    </div>
  );
}

function ImportTable({imports}){
  const[filter,setFilter]=useState('all');
  const SC={STUBBABLE:'#22c55e',PARTIAL:'#eab308',STUB:'#f97316',HARDWARE:'#ef4444',UNKNOWN:'#6b7280'};
  const grouped={};imports.forEach(i=>{const c=categorize(i.name);(grouped[c.key]||(grouped[c.key]={cat:c,items:[]})).items.push(i);});
  const counts={};imports.forEach(i=>{const{status}=categorize(i.name);counts[status]=(counts[status]||0)+1;});
  const unknownCount=counts['UNKNOWN']||0;
  const hwCount=counts['HARDWARE']||0;
  const statuses=['all','STUBBABLE','PARTIAL','STUB','HARDWARE','UNKNOWN'];
  const filtered=filter==='all'?Object.values(grouped):Object.values(grouped).filter(g=>g.cat.status===filter);
  return(
    <div>
      {/* Phase 3: warnings for unknown/hardware symbols */}
      {unknownCount>0&&<div style={{background:'rgba(107,114,128,0.1)',border:'1px solid rgba(107,114,128,0.3)',borderRadius:4,padding:'6px 10px',fontSize:10,color:'#9ca3af',marginBottom:8}}>⚠ {unknownCount} unknown symbol{unknownCount>1?'s':''} — app may crash or behave incorrectly</div>}
      {hwCount>0&&<div style={{background:'rgba(239,68,68,0.07)',border:'1px solid rgba(239,68,68,0.2)',borderRadius:4,padding:'6px 10px',fontSize:10,color:'#f87171',marginBottom:8}}>ℹ {hwCount} hardware stub{hwCount>1?'s':''} — SubGHz / NFC / BT are NO-OPs, no real hardware access</div>}
      <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:12}}>
        {statuses.map(s=>{const col=s==='all'?'#888':SC[s];const cnt=s==='all'?imports.length:(counts[s]||0);return(<button key={s} onClick={()=>setFilter(s)} style={{fontSize:10,padding:'2px 7px',borderRadius:3,cursor:'pointer',fontFamily:'monospace',background:`${col}18`,color:col,border:`1px solid ${col}33`,opacity:filter===s?1:0.45}}>{s==='all'?'ALL':s} ({cnt})</button>);})}
      </div>
      {filtered.map(({cat,items})=>(
        <div key={cat.key} style={{marginBottom:10}}>
          <div style={{fontSize:10,letterSpacing:'0.1em',color:'rgba(255,140,0,0.4)',marginBottom:4,textTransform:'uppercase'}}>{cat.label}</div>
          {items.map(i=>(<div key={i.name} style={{display:'flex',alignItems:'center',gap:6,padding:'3px 6px',borderRadius:3,marginBottom:2,background:cat.bg}}><span style={{fontSize:11,color:'#e2e8f0',flex:1,fontFamily:'monospace',wordBreak:'break-all'}}>{i.name}</span><span style={{fontSize:9,padding:'1px 5px',borderRadius:2,background:`${cat.color}22`,color:cat.color,border:`1px solid ${cat.color}44`,whiteSpace:'nowrap'}}>{cat.status}</span></div>))}
        </div>
      ))}
    </div>
  );
}

function LogPanel({logs}){
  const ref=useRef();useEffect(()=>{if(ref.current)ref.current.scrollTop=ref.current.scrollHeight;},[logs]);
  return(<div ref={ref} style={{height:200,overflowY:'auto',fontFamily:'monospace',fontSize:10,lineHeight:1.7,background:'#050805',border:'1px solid rgba(155,188,15,0.12)',borderRadius:4,padding:'8px 10px',color:'rgba(155,188,15,0.7)'}}>
    {logs.length===0&&<span style={{opacity:0.3}}>No output — load a .fap and press RUN</span>}
    {logs.map((l,i)=><div key={i} style={{color:l.startsWith('[ERR]')?'#f87171':l.startsWith('[STUB]')?'rgba(234,179,8,0.5)':'rgba(155,188,15,0.7)'}}>{l}</div>)}
  </div>);
}

/* ── Main App ───────────────────────────────────────────────────────────── */
function App(){
  const[fap,setFap]          =useState(null);
  const[error,setError]      =useState(null);
  const[drag,setDrag]        =useState(false);
  const[zoomed,setZoomed]    =useState(false);
  const[emuState,setEmuState]=useState('idle');
  const[logs,setLogs]        =useState([]);
  const[ucReady,setUcReady]  =useState(false);
  const[ucErr,setUcErr]      =useState(null);
  const[tab,setTab]          =useState('info');

  const canvasRef   =useRef();
  const fileRef     =useRef();
  const displayRef  =useRef(new FlipperDisplay());
  const ucRef       =useRef(null);
  const inputQueue  =useRef([]);
  const loopRef     =useRef(null);
  const emuStateRef =useRef('idle');
  const watchdogRef =useRef(null);
  const pendingDrawRef=useRef(false);
  const waitingInputRef=useRef(false);

  const winW=useWindowWidth();
  const mobile=winW<600,tablet=winW<960;
  const scale=mobile?3:4;

  const addLog=useCallback(msg=>setLogs(l=>[...l.slice(-200),msg]),[]);
  const renderDisplay=useCallback(()=>{if(canvasRef.current)displayRef.current.render(canvasRef.current,scale);},[scale]);
  useEffect(()=>renderDisplay(),[renderDisplay]);

  /* Load Unicorn.js */
  useEffect(()=>{
    if(window.uc){setUcReady(true);return;}
    const try2=(url,fb)=>{const s=document.createElement('script');s.src=url;s.onload=()=>{setUcReady(true);addLog('[EMU] Unicorn.js loaded ✓');};s.onerror=()=>{if(fb)fb();else setUcErr('Unicorn.js unavailable. Download unicorn.js from github.com/AlexAltea/unicorn.js and add a <script src="unicorn.js"> tag.');};document.head.appendChild(s);};
    try2('unicorn.js',()=>try2('https://cdn.jsdelivr.net/npm/unicorn.js/unicorn.js',()=>try2('https://unpkg.com/unicorn.js/unicorn.js',null)));
  },[addLog]);

  /* Keyboard */
  useEffect(()=>{
    const dn=e=>{const k=KEY_MAP[e.key];if(k!==undefined){e.preventDefault();inputQueue.current.push({key:k,type:InputType.Press});}};
    const up=e=>{const k=KEY_MAP[e.key];if(k!==undefined)inputQueue.current.push({key:k,type:InputType.Release});};
    window.addEventListener('keydown',dn);window.addEventListener('keyup',up);
    return()=>{window.removeEventListener('keydown',dn);window.removeEventListener('keyup',up);};
  },[]);

  const handleFile=useCallback(file=>{
    if(!file)return;
    if(emuStateRef.current==='running')stopFAP();
    setError(null);setFap(null);setEmuState('idle');emuStateRef.current='idle';setLogs([]);
    displayRef.current.clear();renderDisplay();
    const reader=new FileReader();
    reader.onload=e=>{try{
      const r=parseELF(e.target.result);
      setFap({...r,fileName:file.name});
      /* Diagnostic: log all sections and defined symbols */
      const diagLogs=[];
      diagLogs.push(`[ELF] type=${r.isDyn?'ET_DYN':'ET_EXEC'} entry=0x${r.eEntry.toString(16)} sections=${r.rawSections.length} phdrs=${r.phdrs?.length??0}`);
      r.rawSections.filter(s=>s.name&&s.size>0).forEach(s=>diagLogs.push(`[SEC] ${s.name} size=${s.size} addr=0x${s.addr.toString(16)} type=${s.type} flags=${s.flags}`));
      const defFns=Object.entries(r.definedFns||{});
      if(defFns.length>0)defFns.forEach(([n,a])=>diagLogs.push(`[SYM] defined: ${n} @ 0x${a.toString(16)}`));
      else diagLogs.push('[SYM] No interceptable SDK symbols found as defined functions');
      diagLogs.push(`[SYM] ${r.imports.length} undefined imports, ${r.relSections.length} rel sections`);
      /* Dump first 64 bytes of .fast.rel.text for format analysis */
      const fastRel=r.rawSections.find(s=>s.name==='.fast.rel.text');
      if(fastRel){
        const u8=new Uint8Array(r.buffer,fastRel.offset,Math.min(fastRel.size,64));
        const hex=Array.from(u8).map(b=>b.toString(16).padStart(2,'0')).join(' ');
        diagLogs.push(`[FAST] .fast.rel.text size=${fastRel.size} first 64B: ${hex}`);
        /* Try parsing as {uint32 count, then count×{uint32 offset, uint32 hash, uint8 flags}} */
        const dv=new DataView(r.buffer,fastRel.offset,fastRel.size);
        const cnt=dv.getUint32(0,true);
        diagLogs.push(`[FAST] count=${cnt} (${fastRel.size-4}/${cnt}=${((fastRel.size-4)/cnt).toFixed(2)} bytes/entry)`);
      }
      setLogs(diagLogs);
    }catch(err){setError(err.message);}};

    reader.readAsArrayBuffer(file);
  },[renderDisplay]);

  const runFAP=useCallback(async()=>{
    if(!fap||!ucReady||!window.uc){addLog('[ERR] Unicorn.js not ready');return;}
    if(fap.imports.length===0&&Object.keys(fap.definedFns||{}).length===0){
      addLog('[WARN] No SDK symbols found — binary may be fully stripped. Attempting anyway...');
    }
    setEmuState('running');emuStateRef.current='running';
    setLogs([]);displayRef.current.clear();renderDisplay();
    let commitSeen=false;
    watchdogRef.current=setTimeout(()=>{
      if(emuStateRef.current==='running'&&!commitSeen){
        addLog('[WARN] No display output after 5s — try pressing OK or UP to trigger a draw callback.');
        addLog('[WARN] If your app uses ViewPort, make sure draw callback is registered before the event loop.');
        addLog('[WARN] Check the LOG tab for [DRAW] entries showing when draw callbacks were triggered.');
        setError('No display output after 5s. Check the LOG for [DRAW] entries. If no draw callback was registered, the app may require RTOS features.');
      }
      watchdogRef.current=null;
    },5000);
    const watchdog=watchdogRef.current;
    try{
      const uc=new window.uc.Unicorn(window.uc.ARCH_ARM,window.uc.MODE_THUMB);
      ucRef.current=uc;
      pendingDrawRef.current=false;waitingInputRef.current=false;
      const{stubs,handlers}=buildStubs(displayRef.current,inputQueue,addLog,{
        onDraw:()=>{pendingDrawRef.current=true;},
        onWaitInput:(uc_h)=>{waitingInputRef.current=true;pendingDrawRef.current=true;uc_h.emu_stop();}
      });
      uc.hook_add(window.uc.HOOK_CODE,(uc_h,addr)=>{
        const h=handlers[addr];
        if(h!==undefined){let ret;try{ret=h(uc_h);}catch(e){addLog(`[ERR] ${e?.message??String(e)}`);ret=0;}if(ret!==undefined)uc_h.reg_write(RP.R0,ret>>>0);const lr=uc_h.reg_read(RP.LR)>>>0;uc_h.reg_write(RP.PC,lr&~1);if(addr===stubs['canvas_commit']){commitSeen=true;renderDisplay();}}
        if((uc_h.reg_read(RP.PC)>>>0)===0xFEFEFEFE)uc_h.emu_stop();
      },STUB_BASE,STUB_BASE+0x100000);
      /* HOOK_INTR — log software interrupts (SVC etc) */
      try{uc.hook_add(window.uc.HOOK_INTR,(uc_h,intno)=>{addLog(`[INT] interrupt #${intno}`);});}catch(e){}
      /* EXC_RETURN hook — simulate Cortex-M exception return by popping the hardware frame */
      try{uc.hook_add(window.uc.HOOK_CODE,(uc_h)=>{
        /* Read 4 bytes from emulated memory */
        const r32=(a)=>{const b=new ArrayBuffer(4);try{uc_h.mem_read(a>>>0,b);}catch(e){}return new DataView(b).getUint32(0,true);};
        const sp=(uc_h.reg_read(RP.SP)>>>0);
        /* Cortex-M exception frame: R0,R1,R2,R3,R12,LR,PC,xPSR at SP..SP+31 */
        const retR0=r32(sp),retR1=r32(sp+4),retR2=r32(sp+8),retR3=r32(sp+12);
        const retR12=r32(sp+16),retLR=r32(sp+20),retPC=r32(sp+24);
        uc_h.reg_write(RP.SP,(sp+32)>>>0);
        uc_h.reg_write(RP.R0,retR0>>>0);uc_h.reg_write(RP.R1,retR1>>>0);
        uc_h.reg_write(RP.R2,retR2>>>0);uc_h.reg_write(RP.R3,retR3>>>0);
        uc_h.reg_write(RP.LR,retLR>>>0);
        const dst=(retPC>>>0);
        if(dst===0xFEFEFEFE||dst===0){
          uc_h.emu_stop();
          emuStateRef.current='idle';
          if(watchdogRef.current){clearTimeout(watchdogRef.current);watchdogRef.current=null;}
          if(!commitSeen){
            addLog('[WARN] App exited without drawing anything.');
            addLog('[WARN] Static binaries require full Flipper OS simulation — canvas calls go to hardware, not our stubs.');
            addLog('[WARN] Make sure your app calls view_port_draw_callback_set before gui_add_view_port.');
            setError('App exited without drawing. SDK stubs returned no-ops — try pressing OK/UP after RUN to trigger input-driven draws.');
          } else {
            addLog('[EMU] App exited normally.');
          }
          setEmuState('idle');
        }
        else{uc_h.reg_write(RP.PC,(dst|1)>>>0);}  // resume in THUMB mode
      },0xFFFF0000,0xFFFFFFFF);}catch(e){addLog(`[EXC] hook err: ${e?.message??String(e)}`);}
      /* Demand-paging hook: map any unmapped region on access so startup writes don't crash */
      const MEM_INVALID=(window.uc.HOOK_MEM_READ_UNMAPPED??16)|(window.uc.HOOK_MEM_WRITE_UNMAPPED??32)|(window.uc.HOOK_MEM_FETCH_UNMAPPED??64);
      let dynMaps=0;
      try{uc.hook_add(MEM_INVALID,(uc_h,_type,addr)=>{
        const page=((addr>>>0)&0xFFFF0000)>>>0;  // unsigned page-align
        try{
          uc_h.mem_map(page,0x10000,7);
          const fill=new Uint8Array(0x10000);for(let i=0;i<0x8000;i++){fill[i*2]=0x70;fill[i*2+1]=0x47;}
          uc_h.mem_write(page,fill);
        }catch(e){}
        if(dynMaps<16){addLog(`[MEM] dyn-map 64KB @ 0x${page.toString(16)} (access 0x${(addr>>>0).toString(16)})`);dynMaps++;}
        return true;
      },1,0xFFFFFFFF);}catch(e){addLog(`[MEM] hook unavailable: ${e?.message??String(e)}`);}
      /* Static binary: definedFns — merged into csMap above if callSites hook exists,
         otherwise add a separate range hook */
      const staticFns=fap.definedFns||{};
      const staticCount=Object.keys(staticFns).length;
      if(staticCount>0&&callSites.length===0){
        /* No callSites hook yet — add one covering .text for definedFns */
        const dfMap={};
        for(const[name,addr]of Object.entries(staticFns)){
          if(stubs[name]!==undefined&&handlers[stubs[name]])dfMap[addr>>>0]={name,isDF:true};
        }
        addLog(`[EMU] Intercepting ${Object.keys(dfMap).length} defined SDK functions`);
        uc.hook_add(window.uc.HOOK_CODE,(uc_h,addr)=>{
          const e=dfMap[addr>>>0];if(!e)return;
          const handler=handlers[stubs[e.name]];
          let ret;try{ret=handler(uc_h);}catch(er){ret=0;}
          if(ret!==undefined)uc_h.reg_write(RP.R0,ret>>>0);
          if(e.name==='canvas_commit'){commitSeen=true;renderDisplay();}
          const lr=(uc_h.reg_read(RP.LR)>>>0)&~1;
          uc_h.reg_write(RP.PC,lr?lr:0xFEFEFEFE);
        },LOAD_BASE,LOAD_BASE+4*1024*1024);
      } else if(staticCount>0){
        /* Merge definedFns into the existing csMap (re-add hook) — handled below */
      }
      /* triggerDraw: call the registered draw callback with a fake canvas */
      const triggerDraw=()=>{
        const cb=stubs._getVPDraw(),ctx=stubs._getVPCtx();
        if(!cb){addLog('[DRAW] no draw callback registered yet');return;}
        const sv=[[RP.R0,RP.R1,RP.R2,RP.R3,RP.LR,RP.PC,RP.SP].map(r=>[r,uc.reg_read(r)>>>0])];
        uc.reg_write(RP.R0,CANVAS_FAKE);uc.reg_write(RP.R1,ctx>>>0);uc.reg_write(RP.LR,0xFEFEFEFE);
        addLog(`[DRAW] calling draw_cb @ 0x${cb.toString(16)}`);
        try{uc.emu_start(cb|1,0xFEFEFEFE,0,1000000);commitSeen=true;renderDisplay();}catch(e){addLog(`[DRAW] err: ${e?.message??String(e)}`);}
        sv[0].forEach(([r,v])=>uc.reg_write(r,v));
      };
      const{entry,callSites}=loadFAP(uc,fap,stubs,addLog);
      /* Static call sites: ONE hook covering all of .text, map lookup per instruction */
      if(callSites.length>0){
        const csMap={};
        for(const{addr,symName}of callSites){
          if(stubs[symName]!==undefined&&handlers[stubs[symName]])csMap[addr>>>0]=symName;
        }
        const csCount=Object.keys(csMap).length;
        addLog(`[EMU] Hooking ${csCount} static call sites (single-hook)`);
        uc.hook_add(window.uc.HOOK_CODE,(uc_h,addr)=>{
          const symName=csMap[addr>>>0];if(symName===undefined)return;
          const handler=handlers[stubs[symName]];
          let ret;try{ret=handler(uc_h);}catch(e){ret=0;}
          if(ret!==undefined)uc_h.reg_write(RP.R0,ret>>>0);
          if(symName==='canvas_commit'){commitSeen=true;renderDisplay();}
          if(symName==='view_port_update'||symName==='gui_add_view_port'){pendingDrawRef.current=true;}
          uc_h.reg_write(RP.PC,(addr+4)>>>0);
        },LOAD_BASE,LOAD_BASE+4*1024*1024);
      }
      /* Re-emit .fast.rel.text using pre-stored bytes (avoids ArrayBuffer lookup) */
      if(fap.fastRelBytes&&fap.fastRelBytes.length>0){
        const hex=fap.fastRelBytes.slice(0,80).map(b=>b.toString(16).padStart(2,'0')).join(' ');
        addLog(`[FAST] size=${fap.fastRelBytes.length} bytes: ${hex}`);
        const dv=new DataView(new Uint8Array(fap.fastRelBytes).buffer);
        const cnt=dv.getUint32(0,true);
        addLog(`[FAST] count=${cnt} entry_size=${((fap.fastRelBytes.length-4)/cnt).toFixed(2)}`);
      }else{addLog('[FAST] no .fast.rel.text section found');}
      addLog('[EMU] Running — user-provided binary · sandboxed · no hardware access');
      try{uc.emu_start(entry,0xFEFEFEFE,0,2000000);}catch(e){addLog(`[EMU] init error: ${e?.message??String(e)}`);}
      renderDisplay();
      const tick=()=>{
        if(emuStateRef.current!=='running'){loopRef.current=null;return;}
        if(pendingDrawRef.current){pendingDrawRef.current=false;triggerDraw();}
        if(!waitingInputRef.current){
          try{const pc=uc.reg_read(RP.PC)>>>0;if(pc&&pc!==0xFEFEFEFE)uc.emu_start(pc|1,0xFEFEFEFE,0,5000);renderDisplay();}catch(e){if(emuStateRef.current==='running')addLog(`[ERR] tick: ${e?.message??String(e)}`);}
        }else{
          if(inputQueue.current.length>0){waitingInputRef.current=false;try{const pc=uc.reg_read(RP.PC)>>>0;if(pc&&pc!==0xFEFEFEFE)uc.emu_start(pc|1,0xFEFEFEFE,0,50000);renderDisplay();}catch(e){}}
          else renderDisplay();
        }
        loopRef.current=requestAnimationFrame(tick);
      };
      loopRef.current=requestAnimationFrame(tick);
    }catch(e){if(watchdogRef.current){clearTimeout(watchdogRef.current);watchdogRef.current=null;}addLog(`[ERR] ${e?.message??String(e)}`);setEmuState('error');emuStateRef.current='error';}
  },[fap,ucReady,addLog,renderDisplay]);

  const stopFAP=()=>{
    emuStateRef.current='stopped';
    if(loopRef.current)cancelAnimationFrame(loopRef.current);
    if(watchdogRef.current){clearTimeout(watchdogRef.current);watchdogRef.current=null;}
    try{if(ucRef.current)ucRef.current.emu_stop();}catch(e){}
    setEmuState('idle');addLog('[EMU] Stopped.');
  };

  const statusColor={idle:'#6b7280',loading:'#eab308',running:'#22c55e',error:'#ef4444',stopped:'#6b7280'}[emuState]||'#6b7280';
  const P={background:'rgba(255,255,255,0.025)',border:'1px solid rgba(255,140,0,0.1)',borderRadius:6,padding:mobile?10:14};
  const PT={fontSize:10,letterSpacing:'0.2em',color:'rgba(255,140,0,0.45)',marginBottom:10,textTransform:'uppercase'};
  const fmt=n=>n>=1024?`${(n/1024).toFixed(1)}KB`:`${n}B`;

  return(
    <div style={{fontFamily:"'Courier New',monospace",background:'#06070f',color:'#e2e8f0',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <div style={{flex:1,padding:mobile?8:20}}>

        {/* Header */}
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,borderBottom:'1px solid rgba(255,140,0,0.12)',paddingBottom:12,flexWrap:'wrap'}}>
          <div style={{fontSize:mobile?14:17,fontWeight:'bold'}}><span style={{color:'#ff9900'}}>FAP</span> EMU</div>
          <div style={{fontSize:9,color:'rgba(255,140,0,0.35)',letterSpacing:'0.16em'}}>FLIPPER-COMPATIBLE APP EMULATOR · PHASE 3</div>
          <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
            <div style={{width:7,height:7,borderRadius:'50%',background:statusColor,boxShadow:`0 0 6px ${statusColor}`}}/>
            <span style={{fontSize:9,color:statusColor,letterSpacing:'0.1em'}}>{emuState.toUpperCase()}</span>
          </div>
        </div>

        {/* Phase 3: safety banner */}
        <div style={{background:'rgba(255,140,0,0.05)',border:'1px solid rgba(255,140,0,0.15)',borderRadius:4,padding:'6px 12px',fontSize:10,color:'rgba(255,140,0,0.55)',marginBottom:10,display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <span>🔒 Runs in sandboxed environment · No hardware access · SubGHz / NFC / BT are not simulated</span>
        </div>

        {!ucReady&&!ucErr&&<div style={{background:'rgba(234,179,8,0.07)',border:'1px solid rgba(234,179,8,0.2)',borderRadius:4,padding:'6px 10px',fontSize:10,color:'#eab308',marginBottom:8}}>⟳ Loading Unicorn.js ARM emulator...</div>}
        {ucErr&&<div style={{background:'rgba(239,68,68,0.07)',border:'1px solid rgba(239,68,68,0.2)',borderRadius:4,padding:'6px 10px',fontSize:10,color:'#f87171',marginBottom:8}}>⚠ {ucErr}</div>}
        {error&&<div style={{background:'rgba(239,68,68,0.08)',border:'1px solid rgba(239,68,68,0.25)',borderRadius:6,padding:12,color:'#fca5a5',fontSize:12,marginBottom:10}}>⚠ {error}</div>}

        {/* Drop zone */}
        {!fap&&(
          <div style={{border:`2px dashed ${drag?'#ff9900':'rgba(255,140,0,0.22)'}`,borderRadius:8,background:drag?'rgba(255,140,0,0.04)':'transparent',padding:mobile?28:56,textAlign:'center',cursor:'pointer',transition:'all 0.2s'}}
            onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0]);}}
            onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)}
            onClick={()=>fileRef.current.click()}>
            <div style={{fontSize:36,marginBottom:8,opacity:0.3}}>📦</div>
            <div style={{fontSize:mobile?13:15,color:'rgba(255,255,255,0.5)',marginBottom:4}}>Drop a .fap file here</div>
            <div style={{fontSize:10,color:'rgba(255,140,0,0.3)',letterSpacing:'0.1em'}}>OR TAP TO BROWSE · USER-PROVIDED BINARY</div>
            <input ref={fileRef} type="file" accept=".fap" onChange={e=>handleFile(e.target.files[0])}/>
          </div>
        )}

        {fap&&(
          <>
            {/* Phase 3: user-provided binary warning */}
            <div style={{background:'rgba(234,179,8,0.06)',border:'1px solid rgba(234,179,8,0.2)',borderRadius:4,padding:'5px 10px',fontSize:10,color:'rgba(234,179,8,0.7)',marginBottom:10}}>
              ⚠ User-provided binary: <span style={{color:'#ff9900'}}>{fap.fileName}</span> — not verified or endorsed
            </div>

            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12,flexWrap:'wrap'}}>
              <span style={{fontSize:11,color:'rgba(255,255,255,0.3)'}}>{fmt(fap.fileSize)} · {fap.imports.length} imports · {fap.isDyn?'PIC':'static'}</span>
              <div style={{marginLeft:'auto',display:'flex',gap:6}}>
                {emuState==='running'
                  ?<button onClick={stopFAP} style={{padding:'5px 12px',background:'rgba(239,68,68,0.12)',border:'1px solid rgba(239,68,68,0.35)',color:'#f87171',borderRadius:3,fontSize:10,cursor:'pointer',fontFamily:'monospace',letterSpacing:'0.1em'}}>■ STOP</button>
                  :<button onClick={runFAP} disabled={!ucReady} style={{padding:'5px 12px',background:ucReady?'rgba(34,197,94,0.12)':'rgba(255,255,255,0.03)',border:`1px solid ${ucReady?'rgba(34,197,94,0.35)':'rgba(255,255,255,0.08)'}`,color:ucReady?'#22c55e':'rgba(255,255,255,0.18)',borderRadius:3,fontSize:10,cursor:ucReady?'pointer':'default',fontFamily:'monospace',letterSpacing:'0.1em'}}>▶ RUN</button>
                }
                <button onClick={()=>{stopFAP();setFap(null);setError(null);}} style={{padding:'5px 10px',background:'transparent',border:'1px solid rgba(255,255,255,0.08)',color:'rgba(255,255,255,0.25)',borderRadius:3,fontSize:10,cursor:'pointer',fontFamily:'monospace'}}>EJECT</button>
              </div>
            </div>

            <div style={{display:'grid',gridTemplateColumns:mobile?'1fr':tablet?'auto 1fr':'auto 1fr',gap:10,alignItems:'start'}}>
              <div style={{display:'flex',flexDirection:'column',gap:10,alignItems:mobile?'center':'flex-start'}}>
                <div style={P}><FlipperScreen canvasRef={canvasRef} scale={scale} onZoom={()=>setZoomed(true)}/></div>
                <div style={P}>
                  <div style={PT}>CONTROLS · ARROWS / ENTER / ESC</div>
                  <DPad onInput={(key,type)=>{inputQueue.current.push({key,type});if(emuState!=='running')addLog(`[INPUT] ${Object.keys(InputKey)[key]} ${type===0?'↓':'↑'}`);}}/>
                </div>
              </div>

              <div style={P}>
                <div style={{display:'flex',gap:2,marginBottom:12,flexWrap:'wrap'}}>
                  {[['info','INFO'],['imports',`IMPORTS (${fap.imports.length})`],['log','LOG']].map(([k,l])=>(
                    <button key={k} onClick={()=>setTab(k)} style={{padding:'4px 10px',borderRadius:'3px 3px 0 0',border:'1px solid',fontFamily:'monospace',fontSize:10,cursor:'pointer',background:tab===k?'rgba(255,140,0,0.12)':'transparent',borderColor:tab===k?'rgba(255,140,0,0.35)':'rgba(255,255,255,0.07)',color:tab===k?'#ff9900':'rgba(255,255,255,0.25)'}}>{l}</button>
                  ))}
                </div>

                {tab==='info'&&(
                  <div>
                    {[['App Name',fap.appName??'—'],['App ID',fap.appId??'—'],['File',fap.fileName],['Size',fmt(fap.fileSize)],['Format',fap.isDyn?'ARM ELF (PIC)':'ARM ELF'],['Entry',`0x${fap.eEntry.toString(16).padStart(8,'0')}`],['Sections',fap.sections.length],['Imports',fap.imports.length],['.text',fmt(fap.textSize)],['.rodata',fmt(fap.rodataSize)],['.data',fmt(fap.dataSize)],['.bss',fmt(fap.bssSize)]].map(([k,v])=>(
                      <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'4px 0',borderBottom:'1px solid rgba(255,255,255,0.04)'}}><span style={{fontSize:11,color:'rgba(255,255,255,0.3)'}}>{k}</span><span style={{fontSize:11,color:'#e2e8f0',fontFamily:'monospace'}}>{v}</span></div>
                    ))}
                    {(()=>{const s=fap.imports.filter(i=>['STUBBABLE','PARTIAL'].includes(categorize(i.name).status)).length;const pct=Math.round((s/Math.max(1,fap.imports.length))*100);return(
                      <div style={{marginTop:14}}>
                        <div style={{fontSize:10,color:'rgba(255,255,255,0.25)',marginBottom:6}}>EMU READINESS</div>
                        <div style={{display:'flex',height:5,borderRadius:3,overflow:'hidden',marginBottom:5}}><div style={{width:`${pct}%`,background:'#22c55e'}}/><div style={{flex:1,background:'rgba(239,68,68,0.35)'}}/></div>
                        <div style={{display:'flex',justifyContent:'space-between',fontSize:10}}><span style={{color:'#22c55e'}}>{s} stubbable</span><span style={{color:'rgba(255,255,255,0.25)'}}>{pct}%</span><span style={{color:'#ef4444'}}>{fap.imports.length-s} hardware</span></div>
                      </div>
                    );})()}
                  </div>
                )}
                {tab==='imports'&&<div style={{maxHeight:mobile?280:500,overflowY:'auto'}}><ImportTable imports={fap.imports}/></div>}
                {tab==='log'&&<LogPanel logs={logs}/>}
              </div>
            </div>
          </>
        )}
      </div>

      {/* Phase 3: Legal footer */}
      <footer style={{borderTop:'1px solid rgba(255,140,0,0.1)',padding:'10px 20px',display:'flex',gap:16,flexWrap:'wrap',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{fontSize:9,color:'rgba(255,255,255,0.2)',letterSpacing:'0.08em'}}>
          <span style={{color:'rgba(255,140,0,0.4)'}}>FAP EMU</span>
          {' · '}Not affiliated with Flipper Devices Inc.
          {' · '}User is responsible for uploaded binaries
          {' · '}Open source
        </div>
        <div style={{fontSize:9,color:'rgba(255,255,255,0.15)'}}>
          github.com/joelewis012/flipper-EMU
        </div>
      </footer>

      {zoomed&&<ZoomModal canvasRef={canvasRef} onClose={()=>setZoomed(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
